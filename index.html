<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>海洋館｜熱帶海洋區</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#02101c;--fg:#d9f2ff;--ac:#5fd0e6;--pn:rgba(3,20,36,.72);--bd:rgba(95,208,230,.35);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#02101c;--fg:#d9f2ff;--ac:#5fd0e6;--pn:rgba(3,20,36,.72);--bd:rgba(95,208,230,.35)}}
:root[data-theme="dark"]{--bg:#02101c;--fg:#d9f2ff;--ac:#5fd0e6;--pn:rgba(3,20,36,.72);--bd:rgba(95,208,230,.35)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
.panel{position:fixed;background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;backdrop-filter:blur(6px)}
#title{left:12px;top:calc(12px + env(safe-area-inset-top,0px));font-size:20px;font-weight:700;letter-spacing:.08em}
#title small{display:block;font-size:12px;font-weight:400;opacity:.7;letter-spacing:0;margin-top:2px}
#audio{right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:8px;align-items:center;font-size:13px}
#nav{left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
button,.fl{font:inherit;color:var(--fg);background:rgba(95,208,230,.12);border:1px solid var(--bd);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover,.fl:hover{background:rgba(95,208,230,.28)}
button:focus-visible,.fl:focus-within{outline:2px solid var(--ac);outline-offset:2px}
button.on{background:var(--ac);color:#02202c;font-weight:700}
#pad{right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:none;flex-direction:column;gap:6px;border:0;background:none;padding:0}
#pad button{width:56px;height:46px;font-size:18px}
@media (pointer:coarse){#pad{display:flex}#help{display:none}}
#help{left:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));font-size:12px;opacity:.8;max-width:210px}
#fade{position:fixed;inset:0;background:#02101c;opacity:0;pointer-events:none;transition:opacity .6s}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;background:radial-gradient(ellipse at 50% 30%,#0b4a6e 0%,#02101c 70%)}
#start h1{font-size:clamp(34px,7vw,64px);margin:0;letter-spacing:.18em;font-weight:700}
#start p{max-width:30em;line-height:1.8;margin:0;opacity:.85}
#go{font-size:18px;padding:12px 32px;background:var(--ac);color:#02202c;font-weight:700;border:0}
input[type=range]{width:80px;accent-color:#5fd0e6}
.fl input{display:none}
[hidden]{display:none!important}
#wc{position:absolute;inset:0;width:100%;height:100%}#start>:not(canvas){position:relative;z-index:1}
#start h1{animation:fl 6s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){#start h1{animation:none}}
#buy{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ac);color:#02202c;font-weight:700;padding:10px 26px;border:0}
#hint{left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top,0px));font-size:14px;text-align:center}
#hint:empty{display:none}
#ticket{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(2,10,16,.72)}
.tk{width:min(320px,86vw);padding:22px;background:#ebe4d2;color:#10202c;border-radius:6px;display:flex;flex-direction:column;gap:10px;text-align:center;border-left:6px dashed #10202c}
.tk b{font-size:22px}.tk em{font-style:normal;font-size:14px}.tk span{font-size:13px;opacity:.75}
.tk button{background:#10202c;color:#ebe4d2;border:0;padding:10px}
#scan{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ac);color:#02202c;font-weight:700;padding:10px 26px;border:0}
#kiosk{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(2,10,16,.78);padding:12px}
.kp{position:relative;width:min(520px,98vw);max-height:94vh;overflow:auto;background:#f3f7fb;color:#12263a;border:16px solid #0a0c0e;outline:2px solid #2a3138;border-radius:24px;box-shadow:0 0 70px rgba(80,180,255,.25),0 24px 60px #000;font-size:16px}
.khd{display:flex;align-items:center;gap:12px;padding:10px 14px;background:linear-gradient(#0f5aa8,#0a3f7a);color:#fff}
.klogo{flex:1;display:flex;align-items:baseline;gap:8px}.klogo b{font-size:20px;letter-spacing:.08em}.klogo small{opacity:.75;font-size:11px;letter-spacing:.1em}
.kt{display:flex;flex-direction:column;align-items:flex-end;font-size:12px;opacity:.9;font-variant-numeric:tabular-nums}
.kp .kln button{padding:4px 10px;border-radius:6px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35);font-size:13px}.kp .kln button.on{background:#fff;color:#0a3f7a;font-weight:700}
#kstp{display:flex;padding:10px 14px 0;gap:6px}#kstp i{flex:1;text-align:center;font-style:normal;font-size:13px;padding:7px 0;border-bottom:4px solid #cfd9e4;color:#7a8ea3}#kstp i.on{border-color:#f28c28;color:#12263a;font-weight:700}#kstp i.ok{border-color:#2b9a5a;color:#2b9a5a}
#kbody{padding:14px 16px 12px;min-height:290px}
.kp h3{margin:0 0 10px;font-size:20px;color:#0a3f7a}
.kp button{color:#12263a;background:#fff;border:2px solid #b9c8d8;border-radius:12px;padding:12px 14px;font-size:16px}.kp button:active{transform:scale(.97)}
.kft{display:flex;gap:8px;padding:10px 14px 14px;background:#e4ecf4;border-top:1px solid #cfd9e4}.kft button{flex:1;padding:10px}
.tile{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:16px!important;margin-bottom:8px}
.tile small{display:block;color:#5d7288;font-size:12px;margin-top:2px}.tile strong{font-size:22px;color:#0a3f7a}
.tile.sel{border-color:#f28c28!important;background:#fff4e6!important;box-shadow:0 0 0 3px rgba(242,140,40,.25)}.tile.off{opacity:.45;pointer-events:none}
.qty{display:flex;justify-content:center;align-items:center;gap:26px;margin:14px 0}.qty b{font-size:34px;min-width:2ch;text-align:center}.qty button{width:56px;height:56px;font-size:28px;padding:0}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:10px 4px;border-top:2px dashed #b9c8d8;margin-top:6px}.tot b{font-size:28px;color:#d4691b}
.kp .pri{width:100%;background:#f28c28;border-color:#f28c28;color:#fff;font-weight:700;margin-top:6px}
.mute{color:#5d7288;font-size:13px;margin:6px 0}
.sum{width:100%;border-collapse:collapse;margin:6px 0}.sum td{padding:9px 4px;border-bottom:1px solid #d5dfe9}.sum td:last-child{text-align:right}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kp .pay button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 8px;font-size:15px}.pay span{font-size:30px}
.cash{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.cash button{font-weight:700}
.disp{background:#0d1f33;color:#7dffb0;font-family:monospace;border-radius:10px;padding:10px 14px;display:flex;justify-content:space-between;font-size:18px;margin:8px 0}
.spin{width:44px;height:44px;border:5px solid #cfd9e4;border-top-color:#0f5aa8;border-radius:50%;margin:30px auto;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:8px;margin:8px 0}.qrbox img{width:150px;height:150px;border:6px solid #fff;box-shadow:0 0 0 1px #b9c8d8}
.tix{display:flex;flex-direction:column;gap:8px;margin:8px 0}.tix div{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid #b9c8d8;border-left:8px solid #0f5aa8;border-radius:8px;padding:8px 12px;animation:pr .5s ease-out both}.tix img{width:64px;height:64px}.tix small{display:block;color:#5d7288}@keyframes pr{from{transform:translateY(-30px);opacity:0}}
#nick{font:inherit;font-size:18px;padding:12px 16px;border-radius:10px;border:1px solid var(--bd);background:rgba(3,20,36,.7);color:var(--fg);width:min(280px,80vw);text-align:center}#nick::placeholder{opacity:.6}
#nickerr{color:#ffb4b4;min-height:1.2em;font-size:14px}#onl{margin-top:6px!important;font-size:13px!important;opacity:1!important}
#start .mute{font-size:12px;opacity:.6}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title" class="panel"><span id="zn"></span><small id="zs"></small><small id="onl"></small></div>
<div id="audio" class="panel">
  <button id="mute" aria-label="開關音樂">音樂：開</button>
  <input id="vol" type="range" min="0" max="1" step="0.05" value="0.6" aria-label="音量">
  <label class="fl">載入本區 MP3<input id="mp3" type="file" accept="audio/*"></label>
</div>
<div id="nav" class="panel"></div>
<div id="help" class="panel">W A S D／方向鍵移動<br>點擊地板走過去<br>拖曳畫面轉動視角<br>走道盡頭的門通往其他展區</div>
<div id="pad" class="panel"><button id="fw" aria-label="前進">▲</button><button id="bw" aria-label="後退">▼</button></div>
<button id="buy" hidden>購買門票</button>
<div id="hint" class="panel"></div>
<div id="ticket" hidden><div class="tk"><b>海洋館 入場券</b><span id="tkn"></span><em>體驗票・免費</em><button id="tkb">領取門票</button></div></div>
<button id="scan" hidden>刷票進場</button>
<div id="kiosk" hidden><div class="kp"><div class="khd"><div class="klogo"><b>海洋館</b><small>OCEAN AQUARIUM</small></div><div class="kt"><span id="kclk"></span><span id="ktm"></span></div><div class="kln"><button data-l="zh" class="on">中文</button> <button data-l="en">EN</button></div></div><div id="kstp"></div><div id="kbody"></div><div class="kft"><button data-s="back" id="kb1"></button><button data-s="close" id="kb2"></button><button data-s="help" id="kb3"></button></div></div></div>
<div id="fade"></div>
<div id="start"><canvas id="wc"></canvas>
  <h1>海洋館</h1>
  <p>站在弧形大水槽前，看珊瑚礁與魚群在光影裡游動。走向後方的門，可前往其他展區。</p>
  <input id="nick" maxlength="12" placeholder="輸入你的暱稱" autocomplete="off" aria-label="暱稱"><div id="nickerr" role="alert"></div>
  <button id="go">進入水族館</button>
  <p class="mute">暱稱與所在位置會透過公開的 mqttgo.io 伺服器分享給其他訪客</p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.3.4/dist/mqtt.min.js"></script>
<script>
const MP3_URL=''; // 想內建音樂：把你自己的海洋 MP3 網址填在這裡（需允許跨站載入）
const $=s=>document.querySelector(s);
const R=14,A=80*Math.PI/180,H=4.2,PI=Math.PI;
const P=(a,r)=>[r*Math.sin(a),-r*Math.cos(a)];
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const rr=(a,b)=>a+(b-a)*rnd();
const ZONES=[
{name:'熱帶海洋館',sub:'珊瑚礁生態',top:'#6fd8ee',bot:'#06365a',fog:0x0b5a80,fd:.017,light:0xcdeeff,sand:0xd8c9a0,rock:0x4a3d58,n:1,jelly:0,ray:.14,
 fish:[0x3fa7ff,0xffd23f,0xff7a3d,0x7dffcf,0xff5fa2,0xb48cff],coral:[0xd98a4a,0xe86a8a,0x8a6bd1,0xc9b04a,0x4fb286,0xd9b38c],
 info:[['藍綠光鰓雀鯛','成群懸浮在枝狀珊瑚上方'],['黃高鰭刺尾鯛','以礁石上的藻類為食'],['小丑魚','與海葵共生的雀鯛'],['桌形軸孔珊瑚','向外延展成盤狀'],['腦紋珊瑚','表面像腦迴的石珊瑚']]},
{name:'深海館',sub:'幽暗中的微光',top:'#14507a',bot:'#010814',fog:0x031a33,fd:.03,light:0x6a9cd0,sand:0x2a3340,rock:0x1d2433,n:.4,jelly:0,ray:.04,
 fish:[0x7ad7ff,0x9affd0,0xffffff,0x6a8cff],coral:[0x3a4f7a,0x4b3a6a,0x2e5a66],
 info:[['巨口魚','具發光器的深海捕食者'],['管眼魚','頭部透明，眼睛朝上']]},
{name:'水母夢幻館',sub:'漂浮的傘狀生物',top:'#8a6af0',bot:'#150a3a',fog:0x2a1a66,fd:.022,light:0xc0a8ff,sand:0x4a3f78,rock:0x2d2457,n:.3,jelly:1,ray:.1,
 fish:[0xffc2f0,0xc2e0ff],coral:[0x7a5ad8,0xc25ad8,0x5a8ad8],
 info:[['海月水母','靠傘體收縮推進'],['水母','沒有腦與心臟的浮游動物']]},
{name:'海底隧道',sub:'穿越海洋的透明隧道',top:'#4fc3f0',bot:'#041a30',tunnel:1},
{name:'大廳 B1',sub:'劇場大魚缸',top:'#4fa0b8',bot:'#04202a',atrium:1}
];
let zi=0,cz=ZONES[0];const LOBBYZ={name:'售票大廳',sub:'返回入口',top:'#aab4bd'};

/* ---------- renderer / scene ---------- */
const cv=$('#c'),renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(70,1,.1,200);
cam.rotation.order='YXZ';cam.position.set(0,1.65,-10);
let yaw=0,pitch=0;
scene.add(new THREE.AmbientLight(0x6aa0c0,.03));
const sun=new THREE.DirectionalLight(0xcdeeff,1.9);sun.position.set(0,30,-10);scene.add(sun);
const spill=[];for(let k=0;k<5;k++){const a=-.9+k*.45,l=new THREE.PointLight(0x3a8fd0,2,7,2);l.position.set(11.5*Math.sin(a),2.4,-11.5*Math.cos(a));scene.add(l);spill.push(l)}

/* ---------- room (static) ---------- */
const L=(c,o={})=>new THREE.MeshLambertMaterial(Object.assign({color:c,fog:false},o));
const room=new THREE.Group();scene.add(room);
const add=(g,m,p=[0,0,0])=>{const o=new THREE.Mesh(g,m);o.position.set(...p);room.add(o);return o};
function tex(S,fn,rep){const c=document.createElement('canvas');c.width=c.height=S;fn(c.getContext('2d'),S);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep,rep);t.anisotropy=8;return t}
// carpet: fibre speckle + 2 m tile seams
const carpet=tex(256,(x,S)=>{x.fillStyle='#3a3d42';x.fillRect(0,0,S,S);for(let i=0;i<40000;i++){const v=52+Math.random()*16|0;x.fillStyle=`rgb(${v},${v+1},${v+3})`;x.fillRect(Math.random()*S,Math.random()*S,1,2)}},40);
add(new THREE.CircleGeometry(R,64),new THREE.MeshStandardMaterial({color:0x2e2e2e,map:carpet,bumpMap:carpet,bumpScale:.3,roughness:1,fog:false}),[0,0,0]).rotation.x=-PI/2;
// tank light spilling onto the carpet, with moving caustic ripples
const FT=mkCaustic();FT.repeat.set(10,10);
const gl=new THREE.RingGeometry(R-9,R-1.3,64,10,PI/2-A,2*A),gp=gl.attributes.position,gcA=new Float32Array(gp.count*3);
for(let i=0;i<gp.count;i++){const k=Math.pow(Math.max(0,(Math.hypot(gp.getX(i),gp.getY(i))-(R-9))/7.7),3)*1.3;gcA.set([.25*k,.6*k,.9*k],i*3)}
gl.setAttribute('color',new THREE.BufferAttribute(gcA,3));
[[FT,1],[null,.35]].forEach(([m,o])=>{const q=add(gl,new THREE.MeshBasicMaterial({map:m,vertexColors:true,transparent:true,opacity:o,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}),[0,.02,0]);q.rotation.x=-PI/2});
// acoustic ceiling tiles with T-bar grid
const ceilT=tex(256,(x,S)=>{x.fillStyle='#101214';x.fillRect(0,0,S,S);for(let i=0;i<5000;i++){const v=70+Math.random()*60|0;x.fillStyle=`rgba(${v-30},${v-32},${v-40},.55)`;x.fillRect(Math.random()*S,Math.random()*S,1+Math.random()*2,1+Math.random()*2)}x.fillStyle='#23282d';x.fillRect(0,0,S,4);x.fillRect(0,0,4,S)},24);
add(new THREE.CircleGeometry(R+.3,64),new THREE.MeshStandardMaterial({map:ceilT,bumpMap:ceilT,bumpScale:1.5,roughness:1,side:THREE.DoubleSide,fog:false}),[0,H,0]).rotation.x=PI/2;
// dark curved bulkhead above the glass, as in the reference photo
const darkM=L(0x14181c,{side:THREE.DoubleSide});
add(new THREE.CylinderGeometry(R-1.2,R-1.2,.9,64,1,true,PI-A,2*A),darkM,[0,H-.45,0]);
add(new THREE.RingGeometry(R-1.2,R,64,1,PI/2-A,2*A),darkM,[0,H-.9,0]).rotation.x=PI/2;
// slatted air vents
const ventT=tex(64,(x,S)=>{x.fillStyle='#16181a';x.fillRect(0,0,S,S);x.fillStyle='#3a3d40';for(let i=0;i<S;i+=8)x.fillRect(0,i,S,3)},1);
[[5,-3,-.5],[-5,-3,.5]].forEach(([x,z,r])=>{const v=add(new THREE.PlaneGeometry(2.2,.5),new THREE.MeshBasicMaterial({map:ventT,fog:false}),[x,H-.01,z]);v.rotation.set(PI/2,0,r)});
const haloC=document.createElement('canvas');haloC.width=haloC.height=64;{const x=haloC.getContext('2d'),g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,240,200,.9)');g.addColorStop(1,'rgba(255,240,200,0)');x.fillStyle=g;x.fillRect(0,0,64,64)}
const haloM=new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(haloC),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,fog:false,opacity:.05});
[[0,3.8,0,.03],[7,3.8,3,.02],[-7,3.8,3,.02]].forEach(([x,y,z,i])=>{const l=new THREE.PointLight(0xffe2b0,i,16);l.position.set(x,y,z);scene.add(l)});
add(new THREE.CylinderGeometry(R+.2,R+.2,H,64,1,true,-PI+A,2*PI-2*A),L(0x0b0e11,{side:THREE.DoubleSide}),[0,H/2,0]);
const RB=8; // back wall follows the tank curve
const wallM=L(0x0b0e11,{side:THREE.DoubleSide});
add(new THREE.CylinderGeometry(RB,RB,H,64,1,true,PI-A,2*A),wallM,[0,H/2,0]);
[-1,1].forEach(s=>{const r=(R+RB)/2,w=add(new THREE.PlaneGeometry(R-RB,H),wallM,[r*Math.sin(s*A),H/2,-r*Math.cos(s*A)]);w.rotation.y=PI/2-s*A});
add(new THREE.CylinderGeometry(R,R,H,64,1,true,PI-A,2*A),new THREE.MeshBasicMaterial({color:0x9fd8ff,opacity:.06,transparent:true,side:THREE.DoubleSide,depthWrite:false,fog:false}),[0,H/2,0]);
const marbleT=tex(512,(x,S)=>{x.fillStyle='#0b0c0e';x.fillRect(0,0,S,S);for(let k=0;k<18;k++){x.strokeStyle=`rgba(210,210,215,${.08+Math.random()*.2})`;x.lineWidth=.5+Math.random()*1.5;x.beginPath();let px=Math.random()*S,py=Math.random()*S;x.moveTo(px,py);for(let s=0;s<8;s++){px+=(Math.random()-.4)*90;py+=(Math.random()-.5)*90;x.lineTo(px,py)}x.stroke()}},1);
const railM=new THREE.MeshStandardMaterial({map:marbleT,roughness:.12,metalness:.15,side:THREE.DoubleSide,fog:false});
add(new THREE.CylinderGeometry(R-1.3,R-1.3,1,64,1,true,PI-A,2*A),railM,[0,.5,0]);
add(new THREE.CylinderGeometry(R-.1,R-.1,1,64,1,true,PI-A,2*A),railM,[0,.5,0]);
